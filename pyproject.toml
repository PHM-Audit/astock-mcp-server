[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astock-mcp-server"
version = "1.0.0"
description = "China A-share quant toolkit as MCP tools: realtime quotes, 60-point technical scoring, multi-indicator signals, strategy backtesting (zero auth, public data)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PHM-Audit" }]
keywords = ["mcp", "astock", "quant", "trading-signals", "backtest", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=1.2.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
astock-mcp-server = "server:main"

[tool.setuptools]
packages = ["astock_core"]
py-modules = ["server", "runner"]
